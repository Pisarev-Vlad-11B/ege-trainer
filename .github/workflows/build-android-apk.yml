name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "manifest.json"
      - "favicon.svg"
      - "apple-touch-icon.png"
      - "4568EABA-61D0-4512-982E-D2756D728869.png"
      - "package.json"
      - "capacitor.config.json"
      - "scripts/**"
      - "assets/**"
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app bundle
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#a93645' --splashBackgroundColor '#171515'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ege-trainer-android-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ege-trainer-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ege-trainer-android-debug
          path: dist/ege-trainer-android-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: ЕГЭ Тренажёр — Android
          body: Автоматическая актуальная Android-сборка ЕГЭ Тренажёра.
          files: dist/ege-trainer-android.apk
          make_latest: true
          fail_on_unmatched_files: true
