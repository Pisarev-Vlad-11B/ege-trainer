name: Build Android APK

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Pages Build and Deployment"]
    types: [completed]

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install JavaScript dependencies
        run: npm install --no-audit --no-fund

      - name: Prepare web app bundle
        run: npm run build:web

      - name: Generate Android project
        run: npx cap add android

      - name: Generate app icons and splash screen
        run: npx capacitor-assets generate --android --iconBackgroundColor '#a93645' --splashBackgroundColor '#171515'

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ege-trainer-android-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ege-trainer-android-debug
          path: dist/ege-trainer-android-debug.apk
          if-no-files-found: error
          retention-days: 30
